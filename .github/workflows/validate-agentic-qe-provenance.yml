name: Validate agentic-qe provenance

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize
      - reopened

permissions:
  contents: read

jobs:
  targeted-test:
    if: github.head_ref == 'fix/agentic-qe-memory-provenance'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/agentic-qe-memory-provenance
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: v3/plugins/agentic-qe/package.json

      - name: Test plugin provenance audit
        run: node --test scripts/__tests__/audit-plugin-memory-provenance.test.mjs

      - name: Audit all plugin memory writes
        run: node scripts/audit-plugin-memory-provenance.mjs --format=json

      - name: Install plugin dependencies
        working-directory: v3/plugins/agentic-qe
        run: npm install --no-package-lock --ignore-scripts

      - name: Run provenance regression
        working-directory: v3/plugins/agentic-qe
        run: npx vitest run src/bridges/QEMemoryBridge.provenance.test.ts

      - name: Type-check plugin
        working-directory: v3/plugins/agentic-qe
        run: npx tsc --noEmit
