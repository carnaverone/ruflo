# Temporary branch-only patch applicator. It removes itself after success.
name: Apply issue 2908 patch

on:
  push:
    branches:
      - fix/post-task-hnsw-indexing-2908
    paths:
      - .github/workflows/apply-2908-patch.yml
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'fix/post-task-hnsw-indexing-2908' || github.ref_name == 'fix/post-task-hnsw-indexing-2908'
    runs-on: ubuntu-latest
    steps:
      - name: Check out correction branch
        uses: actions/checkout@v4
        with:
          ref: fix/post-task-hnsw-indexing-2908
          fetch-depth: 0

      - name: Apply function-scoped HNSW dual-write correction
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          target = Path('v3/@claude-flow/cli/src/memory/memory-initializer.ts')
          lines = target.read_text(encoding='utf-8').splitlines(keepends=True)

          function_start = next(
              i for i, line in enumerate(lines)
              if line.startswith('export async function addToHNSWIndex(')
          )
          function_end = next(
              i for i in range(function_start + 1, len(lines))
              if lines[i].startswith('export async function searchHNSWIndex(')
          )

          start_matches = [
              i for i in range(function_start, function_end)
              if lines[i].strip() == '// ADR-053: Try AgentDB v3 bridge first'
          ]
          if len(start_matches) != 1:
              raise SystemExit(
                  f'expected one bridge block inside addToHNSWIndex, found {len(start_matches)}'
              )

          start = start_matches[0]
          expected = [
              '// ADR-053: Try AgentDB v3 bridge first',
              'const bridge = await getBridge();',
              'if (bridge) {',
              'const bridgeResult = await bridge.bridgeAddToHNSW(id, embedding, entry);',
              'if (bridgeResult === true) return true;',
              '}',
              '',
              'const index = await getHNSWIndex({ dimensions: embedding.length });',
              'if (!index) return false;',
          ]
          actual = [line.strip() for line in lines[start:start + len(expected)]]
          if actual != expected:
              raise SystemExit(f'unexpected bridge block shape: {actual!r}')

          replacement = [
              '  // ADR-053: Keep the AgentDB bridge and the persistent local HNSW\n',
              '  // index in sync. They are separate retrieval surfaces: a successful\n',
              '  // bridge insert must not suppress `.swarm/hnsw.index` metadata.\n',
              '  const bridge = await getBridge();\n',
              '  let bridgeIndexed = false;\n',
              '  if (bridge) {\n',
              '    bridgeIndexed = await bridge.bridgeAddToHNSW(id, embedding, entry) === true;\n',
              '  }\n',
              '\n',
              '  const index = await getHNSWIndex({ dimensions: embedding.length });\n',
              '  if (!index) return bridgeIndexed;\n',
          ]
          lines[start:start + len(expected)] = replacement

          function_start = next(
              i for i, line in enumerate(lines)
              if line.startswith('export async function addToHNSWIndex(')
          )
          function_end = next(
              i for i in range(function_start + 1, len(lines))
              if lines[i].startswith('export async function searchHNSWIndex(')
          )

          catch_matches = [
              i for i in range(function_start, function_end - 2)
              if lines[i].strip() == '} catch {'
              and lines[i + 1].strip() == 'return false;'
              and lines[i + 2].strip() == '}'
          ]
          if len(catch_matches) != 1:
              raise SystemExit(
                  f'expected one addToHNSWIndex catch block, found {len(catch_matches)}'
              )

          catch_start = catch_matches[0]
          lines[catch_start:catch_start + 3] = [
              '  } catch {\n',
              '    return bridgeIndexed;\n',
              '  }\n',
          ]

          source = ''.join(lines)
          bounded = source[
              source.index('export async function addToHNSWIndex('):
              source.index('export async function searchHNSWIndex(')
          ]
          checks = {
              'early bridge return': 'if (bridgeResult === true) return true;' not in bounded,
              'bridge state': 'let bridgeIndexed = false;' in bounded,
              'local fallback': 'if (!index) return bridgeIndexed;' in bounded,
              'catch fallback': bounded.count('return bridgeIndexed;') == 2,
          }
          failed = [name for name, ok in checks.items() if not ok]
          if failed:
              raise SystemExit(f'patch verification failed: {failed}')

          target.write_text(source, encoding='utf-8')
          PY

      - name: Verify focused diff
        shell: bash
        run: |
          git diff --check
          git diff -- v3/@claude-flow/cli/src/memory/memory-initializer.ts
          grep -F "let bridgeIndexed = false;" v3/@claude-flow/cli/src/memory/memory-initializer.ts
          grep -F "if (!index) return bridgeIndexed;" v3/@claude-flow/cli/src/memory/memory-initializer.ts

      - name: Commit correction and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/apply-2908-patch.yml
          git config user.name "carnaverone-ruflo-bot"
          git config user.email "77895611+carnaverone@users.noreply.github.com"
          git add v3/@claude-flow/cli/src/memory/memory-initializer.ts .github/workflows/apply-2908-patch.yml
          git commit -m "fix(memory): keep persistent HNSW in sync with bridge"
          git push origin HEAD:fix/post-task-hnsw-indexing-2908
